BitwiseNotFwdOp:
  ref_api: "torch.bitwise_not"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true
  signature:
    inputs:
      input: {dtype: "bool | uint8 | int8 | int16 | int32 | int64"}
    outputs:
      output: {dtype: "same_as(input)"}
    shape_rules:
    - "output.shape == input.shape"

  workloads:
    # Smoke: small flat vector (bool + uint8 exercise the kernel's
    # special-cased dtype paths: ==0 for bool, xor 255 for uint8)
    - {input_shape: [1048576], dtypes: [bool, uint8, int32], label: "smoke-1m"}
    # Full: GPU manifest elementwise-16M workload (ported verbatim)
    - {input_shape: [4096, 4096], dtypes: [int32, int64], label: "elementwise-16m"}
    # Full: mid-size square
    - {input_shape: [8192, 8192], dtypes: [int16, int32], label: "elementwise-64m"}
    # Full: GPU manifest elementwise-256M workload (ported verbatim)
    - {input_shape: [16384, 16384], dtypes: [int32], label: "elementwise-256m"}

  roofline:
    vars:
      N: "product(input.shape)"
    # ~x: one bitwise op per element (GPU manifest: flops: "N").
    flops: "N"
    bytes: "2 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/bitwise_not/bitwise_not.py
    kernel_map:
      bitwise_not: BitwiseNotFwdKernel
    op: tileops/ops/elementwise/bitwise_not.py
    test: tests/ops/test_bitwise_not.py
    bench: benchmarks/ops/bench_bitwise_not.py
    bench_manifest_driven: true
